[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PAYMOB_INTEGRATION_ID,COURSE_PRICE_CENTS,GMAIL_USER"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/package.json"]

[[redirects]]
  from = "/payment-success.html"
  to   = "/STEP_Free_Preview.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
