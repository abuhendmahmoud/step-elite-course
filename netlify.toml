[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/package.json"]

[[redirects]]
  from = "/payment-success.html"
  to   = "/STEP_Free_Preview.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
